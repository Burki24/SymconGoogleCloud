name: Update library metadata

on:
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: update-library-metadata-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-library-metadata:
    if: "${{ github.event.head_commit == null || !startsWith(github.event.head_commit.message, 'CHORE: Update library metadata') }}"
    runs-on: ubuntu-latest

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.HELPER_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.HELPER_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Check out SymconStubs
        uses: actions/checkout@v6
        with:
          repository: symcon/SymconStubs
          ref: 31f2e0478eb3763236fcf44ea4144271fdeddfd5
          path: tests/stubs
          persist-credentials: false

      - name: Run shared module tests
        uses: Burki24/Symcon_ModuleCI/php-tests@v1.0.0
        with:
          php-version: '8.5'
          php-extensions: mbstring
          setup-python: 'false'
          test-command: php tests/run.php

      - name: Determine and update library metadata
        id: metadata
        # Pin the validated main revision until a release tag includes this action.
        uses: Burki24/Symcon_ModuleCI/library-metadata@0cbd8ff21031325f7335e2e3f6ab767090fe19b9
        with:
          source-sha: ${{ github.sha }}
          before-sha: ${{ github.event.before }}

      - name: Validate generated library metadata
        if: steps.metadata.outputs.changed == 'true'
        run: php tests/validate_structure.php

      - name: Get GitHub App user ID
        if: steps.metadata.outputs.changed == 'true'
        id: app-user
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          printf 'user-id=%s\n' "$user_id" >> "$GITHUB_OUTPUT"

      - name: Commit and push metadata
        if: steps.metadata.outputs.changed == 'true'
        shell: bash
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          APP_USER_ID: ${{ steps.app-user.outputs.user-id }}
          SHORT_SHA: ${{ steps.metadata.outputs.short-sha }}
          VERSION: ${{ steps.metadata.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if git diff --quiet -- library.json; then
            echo "library.json is already up to date."
            exit 0
          fi

          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add library.json
          git commit -m "CHORE: Update library metadata to v${VERSION} (${SHORT_SHA})" \
            -m "Source-Commit: ${SOURCE_SHA}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
